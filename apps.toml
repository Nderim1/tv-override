# App catalog: apps a profile can install by id ([apps].install) and roles they can play.
#
# source = "apk"  -> installed by tvctl from `file` (sha256 checked first; add new APKs only after verifying
#                    them against the official release, see prompts/verify-apk.md)
# source = "play" -> tvctl opens the Play Store page on the TV; the owner clicks Install
#
# Optional roles:
#   home      = launcher activity (for [home].launcher)
#   dream     = screensaver component (for [home].screensaver)
#   a11y      = accessibility service the app needs (owner switches it on in Settings > Accessibility)
#   autostart = true -> needs the vendor autostart app-op (TCL) to run its background service
#   keymap    = true -> receives the [keys] mapping (Remote Remap)
#   actions   = { "<intent action>" = "label" } -> extra targets for remote buttons

[projectivy]
name = "Projectivy Launcher"
package = "com.spocky.projengmenu"
source = "play"
home = "com.spocky.projengmenu/.ui.home.MainActivity"
a11y = "com.spocky.projengmenu/com.spocky.projengmenu.services.ProjectivyAccessibilityService"
a11y_label = "Projectivy Launcher"
actions = { "tv.projectivy.SETTINGS" = "settings sidebar", "tv.projectivy.ALL_APPS" = "all apps" }
note = "Free; button remapping inside Projectivy needs Premium – use Remote Remap instead."

[smarttube]
name = "SmartTube"
package = "org.smarttube.stable"
source = "apk"
file = "apks/SmartTube_stable_32.56_universal.apk"
version = "32.56"
sha256 = "4a35b90940612e048e4e9cb9e10379f7db1e84f30375994129f10a571ee04ce5"
origin = "https://github.com/yuliskov/SmartTube/releases/tag/32.56s"
replaces = ["com.liskovsoft.smarttubetv.beta", "com.liskovsoft.smarttubetv"]
note = "Ad-free YouTube for TV. Package/key changed after the developer's 2025 key compromise; old builds are replaced and the owner signs in again."

[kodi]
name = "Kodi"
package = "org.xbmc.kodi"
source = "play"

[aerialviews]
name = "Aerial Views"
package = "com.neilturner.aerialviews"
source = "play"
dream = "com.neilturner.aerialviews/.ui.screensaver.DreamActivity"

[downloader]
name = "Downloader"
package = "com.esaba.downloader"
source = "play"
note = "Sideload APKs by URL/code on the TV itself."

[remote-remap]
name = "Remote Remap"
package = "com.nde.tvremap"
source = "apk"
file = "remote-remap/remote-remap.apk"
build = "remote-remap/build.sh"
a11y = "com.nde.tvremap/com.nde.tvremap.RemapService"
a11y_label = "Remote Remap"
autostart = true
keymap = true
note = "Our own 16 KB remapper. Built locally; sha256 is not pinned because it changes on every build."

[kodi-rows]
name = "Kodi Rows"
package = "com.nde.kodirows"
source = "apk"
file = "kodi-rows/kodi-rows.apk"
build = "kodi-rows/build.sh"
kodi_rows = true
a11y = "com.nde.kodirows/com.nde.kodirows.DescriptionService"
a11y_label = "Kodi Rows descriptions"
note = "Our own app: [[kodi.rows]] become home screen movie, live TV or radio rows (Android TV preview channels); selecting a card opens Kodi and plays it. type=live or radio uses profile channels with HTTP(S) streams and landscape logos, and refreshes even with Kodi closed. Gjirafa links resolve on entry; Klan signatures renew during playback. Its accessibility service shows the focused item's full description over the launcher's text box. Built locally; sha256 not pinned."

# Screensaver-only entries (preinstalled packages)
[google-ambient]
name = "Google ambient screensaver"
package = "com.google.android.apps.tv.dreamx"
source = "system"
dream = "com.google.android.apps.tv.dreamx/.service.Backdrop"

[backdrop]
name = "Backdrop"
package = "com.google.android.backdrop"
source = "system"
dream = "com.google.android.backdrop/.Backdrop"

[basic-colors]
name = "Basic colours"
package = "com.android.dreams.basic"
source = "system"
dream = "com.android.dreams.basic/.Colors"

# ---- Samsung Tizen apps (platform = "tizen"). Installed in Developer Mode, re-signed with the owner's Samsung
# certificate (tvctl tizen setup). source = "wgt": a verified package in apks/; source = "build": built from
# this repo. app_id launches it, package uninstalls it.

[tizentube]
platform = "tizen"
name = "TizenTube"
source = "wgt"
app_id = "xvvl3S1TT1.TizenTubeStandalone"
package = "xvvl3S1TT1"
version = "2.1.1"
file = "apks/TizenTubeCobalt-2.1.1.wgt"
sha256 = "d5ebcf5b61e907912d5200b033f0d366717cb952c9f543a6332d36bef771b3b5"
min_tizen = 6
older = { file = "apks/TizenTubeOld-2.1.1.wgt", sha256 = "97dd00e3229b47f9892586fcd35ae7f7c8812b18f4be749b19c57a75b9ed6344" }
privilege = "Partner"
origin = "https://github.com/reisxd/TizenTube/releases/tag/v2.1.1"
note = "Ad-free YouTube with SponsorBlock (YouTube's own TV app, modded). Tizen 6+ (2021+) gets the Cobalt build, older TVs the old one. Older-TV playback errors: after installation, set Developer Mode Host PC IP to 127.0.0.1 and fully restart; use the computer's IP again for future installations. Upstream: github.com/reisxd/TizenTube/blob/main/docs/README.md. GPL-3.0."

[override-home]
platform = "tizen"
name = "Override Home"
source = "build"
dir = "samsung-home"
app_id = "TvOvrHome1.Home"
package = "TvOvrHome1"
version = "1.0.0"
home = true
note = "Our home screen: your apps from [home].dock, clock, screensaver. The TV starts in it (Start Screen Options); the Home button still opens Smart Hub."
