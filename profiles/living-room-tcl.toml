# Living room TV. Owner: Nderim.
# Uses: Kodi a lot, YouTube via SmartTube, voice button, AirPlay + screen mirroring, nice screensavers.

[tv]
name = "living-room-tcl"
host = "192.168.1.101"          # behind the modem; reachable from the router side
port = 5555
serial = "380260560EC0ED05C"    # tvctl refuses to apply this profile to another TV
model = "TCL Smart TV Pro (G10_4K_GB), Google TV, Android 12, 1.7 GB RAM"
presets = ["google-tv", "tcl"]  # core + streaming-apps are always loaded

[apps]
# Catalog ids from apps.toml, installed if missing.
install = ["projectivy", "smarttube", "kodi", "aerialviews", "downloader", "remote-remap", "kodi-rows"]

# Never disabled/uninstalled, even if a preset calls them bloat.
keep = [
  "com.google.android.katniss",   # voice button
  "com.tcl.ttvs",                 # TCL voice service
  "com.tcl.airplay2",
  "com.realtek.airplay2",
  "com.tcl.miracast",
  "com.google.android.backdrop",
]

# Optional packages (see presets) the owner does not want. Bloat is disabled automatically unless kept.
disable = [
  "com.google.android.apps.tv.dreamx",
  "com.google.android.youtube.tv",
  "com.google.android.youtube.tvmusic",
  "com.google.android.videos",
  "com.netflix.ninja",
  "com.amazon.amazonvideo.livingroom",
  "com.tcl.ui_mediaCenter",
  "com.tcl.t_solo",
]

# User-installed apps not in `install` or `keep`: "keep-others" (default) or "remove-others" (asks first).
user_apps = "remove-others"

[home]
launcher = "projectivy"         # catalog id; "stock" keeps the TV's own home
screensaver = "aerialviews"     # catalog id with a `dream`
animation_scale = 0.5
# Projectivy homepage: only Favourites, Kodi Movies, Kosovo TV, Kosovo Radios, in that order.
# Other categories/channels are hidden through Projectivy's Edit categories / Edit channels menus.

# Home screen rows of movies from Kodi add-ons (app: kodi-rows). A poster opens Kodi and plays it through the
# add-on. Paths: `tvctl kodi browse living-room-tcl [PATH]`. Rows refresh hourly while Kodi is running.
# Projectivy shows a new row only after Settings › Edit channels › <row> › Visible is switched on (once).
[[kodi.rows]]
id = "new-movies"                # keeps the launcher's row (and its Visible switch) across renames
name = "Kodi Movies"
paths = [
  "plugin://plugin.video.umbrella/?action=tmdbmovies&url=tmdb_discovery_released&folderName=Recently+Released+%28TMDb%29",
  "plugin://plugin.video.umbrella/?action=dvdReleaseList&folderName=Digital+Releases+%28DVDReleaseDates%29",
]
pages = 3                       # follow "Next page" this many times per path
max = 40
sort = "year"                   # newest first
exclude_countries = ["IN"]      # production countries (ISO codes from TMDb)
exclude_languages = ["hi", "ta", "te", "ml", "kn", "bn", "mr", "pa", "gu"]  # original language
exclude_ratings = ["R", "NC-17", "X"]  # US certificate (Kodi's mpaa); unrated films stay

[kodi]
# Channel packs from channels/ (live TV / radio rows, played in Kodi): Kosovo TV and Kosovo Radios.
packs = ["kosovo"]

# Remote buttons -> what they open. Scan codes from `tvctl keys capture`.
# open = package to launch, or action + package for an intent action.
[keys]
233 = { label = "Settings", action = "tv.projectivy.SETTINGS", package = "com.spocky.projengmenu" }
242 = { label = "Netflix", open = "org.xbmc.kodi" }
245 = { label = "YouTube", open = "org.smarttube.stable" }
