# Kosovo TV and radio: a channel pack. A profile adds it with `[kodi] packs = ["kosovo"]` or
# `tvctl install <tv> kosovo` (dashboard: app store). The rows appear on the home screen through Kodi Rows and
# every channel plays in Kodi, so installing the pack also installs Kodi and Kodi Rows. Android TVs only.
# Same format as [[kodi.rows]] in a profile (kodi-rows/README.md); a profile row with the same id wins.
# Sources and how they were checked: kodi-rows/README.md, "Kosovo sources".

name = "Kosovo TV & Radio"
note = "13 Kosovo TV channels (RTK, Klan Kosova, KTV, RTV 21, ATV, Arta News, …) and 11 radio stations as home screen rows; they play in Kodi. Free public streams."

# Free public Kosovo streams, checked 2026-10-25 (playlist + media segment).
# Gjirafa player URLs are resolved fresh when opened; Klan signatures renew throughout playback.
# Subscription-only, blocked and broken streams are omitted. source is the broadcaster/player page.
