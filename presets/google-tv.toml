# Google TV (launcherx). Verified on TCL G10, Android 12.

[preset]
name = "google-tv"
description = "Google TV home (com.google.android.apps.tv.launcherx)"

[match]
packages_any = ["com.google.android.apps.tv.launcherx"]

# Replacing the stock home: these are disabled together, and only once the new launcher is installed,
# set as home and (if it needs one) has its accessibility service on. Disabling launcherx alone makes the
# setup wizard's RecoveryActivity take over the Home intent.
[launcher]
stock = ["com.google.android.apps.tv.launcherx", "com.google.android.tungsten.setupwraith"]
stock_home = "com.google.android.apps.tv.launcherx/.home.HomeActivity"

[live_tv]
packages = ["com.android.providers.tv", "com.google.android.tv"]  # TV provider + Google Live Channels (if present)

[bloat]
"com.google.android.feedback" = "Feedback reporter"
"com.google.android.play.games" = "Play Games"
"com.android.printspooler" = "Printing"
"com.android.wallpaper.livepicker" = "Live wallpapers"
"com.google.android.marvin.talkback" = "Screen reader (move to keep if the owner needs it)"

[optional]
"com.google.android.katniss" = "Assistant / voice search on the remote's mic button (~110 MB with TTS)"
"com.google.android.apps.tv.dreamx" = "Google ambient screensaver (~100 MB)"
"com.google.android.backdrop" = "Backdrop photo screensaver"
"com.google.android.youtube.tv" = "Stock YouTube (phone casting to TV uses it)"
"com.google.android.youtube.tvmusic" = "YouTube Music"
"com.google.android.videos" = "Google TV movies store"
"com.google.android.apps.mediashell" = "Chromecast built-in (casting from phones)"

[core]
"com.google.android.tv" = "Live Channels (antenna/cable guide on some models)"
"com.google.android.apps.tv.launcherx" = "Stock home (handled by [launcher], never disabled directly)"
"com.google.android.tungsten.setupwraith" = "Setup wizard (handled by [launcher])"

# ---- Preparation walkthrough (shown in the dashboard before the first run). Menu names vary by model;
# the agent's research (prompts/prepare-tv.md) replaces these with model-specific steps.

[[prepare]]
id = "update"
title = "Install system updates first"
why = "Updates can switch removed apps back on. Update before we set things up, not after."
path = ["Settings", "System", "About", "System update"]
how = "Install any update, let the TV restart, then come back here."
required = false

[[prepare]]
id = "account"
only_if = "play_store"
title = "Sign in to a Google account"
why = "Needed to install apps from the Play Store (Projectivy, Kodi, Aerial Views…)."
path = ["Settings", "Accounts & sign-in"]
how = "Sign in with the owner's Google account. The app never sees the password."
check = { type = "accounts", min = 1 }
required = true

[[prepare]]
id = "privacy"
title = "Turn off usage reports and ad personalisation"
why = "Stops Google collecting usage data and personalising ads on this TV."
path = ["Settings", "Privacy", "Usage & diagnostics"]
how = "Switch Usage & diagnostics off. Then Settings › Privacy › Ads: delete the advertising ID or turn off personalisation."
required = false

[[prepare]]
id = "cec"
only_if = "hdmi"
title = "HDMI-CEC: one remote for connected devices"
why = "Lets the TV remote control a soundbar, console or set-top box connected over HDMI."
path = ["Settings", "Channels & inputs", "Inputs", "HDMI control"]
how = "Turn it on if something is connected over HDMI; leave it off otherwise."
check = { type = "setting", ns = "global", key = "hdmi_control_enabled", equals = "1" }
auto = { ns = "global", key = "hdmi_control_enabled", value = "1" }
required = false
