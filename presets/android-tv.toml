# Classic Android TV home (com.google.android.tvlauncher). UNTESTED – verify on first use and update.

[preset]
name = "android-tv"
description = "Classic Android TV home (com.google.android.tvlauncher)"

[match]
packages_any = ["com.google.android.tvlauncher"]

[launcher]
stock = ["com.google.android.tvlauncher", "com.google.android.tungsten.setupwraith"]
stock_home = "com.google.android.tvlauncher/.MainActivity"

[live_tv]
packages = ["com.android.providers.tv", "com.google.android.tv"]

[bloat]
"com.google.android.feedback" = "Feedback reporter"
"com.google.android.play.games" = "Play Games"
"com.android.printspooler" = "Printing"
"com.google.android.tvrecommendations" = "Home screen recommendations"

[optional]
"com.google.android.katniss" = "Assistant / voice search"
"com.google.android.backdrop" = "Backdrop screensaver"
"com.google.android.youtube.tv" = "Stock YouTube"
"com.google.android.youtube.tvmusic" = "YouTube Music"
"com.google.android.videos" = "Google Play Movies"
"com.google.android.apps.mediashell" = "Chromecast built-in"

[core]
"com.google.android.tvlauncher" = "Stock home (handled by [launcher])"
"com.google.android.tungsten.setupwraith" = "Setup wizard (handled by [launcher])"

# ---- Preparation walkthrough (UNTESTED menu paths – verify on first use)

[[prepare]]
id = "update"
title = "Install system updates first"
why = "Updates can switch removed apps back on. Update before we set things up, not after."
path = ["Settings", "Device Preferences", "About", "System update"]
required = false

[[prepare]]
id = "account"
only_if = "play_store"
title = "Sign in to a Google account"
why = "Needed to install apps from the Play Store."
path = ["Settings", "Accounts & sign-in"]
check = { type = "accounts", min = 1 }
required = true

[[prepare]]
id = "privacy"
title = "Turn off usage reports and ad personalisation"
why = "Stops Google collecting usage data and personalising ads on this TV."
path = ["Settings", "Device Preferences", "Usage & diagnostics"]
required = false
