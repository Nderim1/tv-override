# TCL Google TV (Realtek platform). Verified on TCL Smart TV Pro (G10_4K_GB), Android 12.

[preset]
name = "tcl"
description = "TCL Google TV"

[match]
manufacturer = ["TCL"]

[quirks]
# TclAppBoot blocks background services of apps that lack this app-op, including accessibility services
# of freshly sideloaded apps ("forbid bind service ... callee_does't_have_OP_AUTO_START_permission").
autostart_appop = "APP_AUTO_START"

# Live TV (antenna / cable / satellite). These packages are never disabled; `player` is what owners open
# to watch channels (pin it in the launcher, or map a remote button to it).
[live_tv]
packages = ["com.tcl.tv", "com.tcl.tvinput", "com.android.providers.tv"]
player = "com.tcl.tv"

# Known remote buttons (BT_RC833 remote). Scan code -> label. Used by `tvctl keys` for nicer output.
[remote_keys]
233 = "Settings"
242 = "Netflix"
245 = "YouTube"

